version: 2
# Groups keep related updates in one reviewable PR: the CodeQL init/analyze/autobuild
# actions must move together, and separate npm patch PRs used to fill the PR limit
# (5 stale PRs from 2026-08 blocked every later npm version update).
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: "/apps/web"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      web-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      codeql:
        patterns: ["github/codeql-action*"]
      actions-minor-patch:
        update-types: [minor, patch]
