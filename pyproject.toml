[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sotuhire"
version = "2.0.0"
description = "Local-first, human-approved career copilot with typed evidence and portfolio intelligence."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "Soturine" }
]
dependencies = [
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "pydantic>=2.7.0",
  "pypdf>=6.21.4,<7.0.0",
  "python-docx>=1.1.0",
  "python-dotenv>=1.2.2",
  "reportlab>=5.0.0,<6.0.0",
  "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
# The Streamlit UI (app.py, modules/ui) is the legacy/dev mode since v1.4; the product is
# apps/web over apps/api. Only this extra installs Streamlit and what it pulls in.
legacy-ui = [
  "streamlit>=1.35.0",
]
dev = [
  "streamlit>=1.35.0",
  "mkdocs>=1.6.0",
  "mkdocs-material>=9.5.0",
  "packaging>=24.0",
  "playwright>=1.55.0",
  "pip-audit>=2.9.0",
  "pre-commit>=3.7.0",
  "pyright>=1.1.400",
  "pytest>=8.2.0",
  "pytest-cov>=5.0.0",
  "ruff==0.17.3",
]
ai = [
  "anthropic>=2.8.0,<3.0.0",
  "google-genai>=1.0.0,<3.0.0",
]
# Authenticated-browser source capture attaches to a Chromium the user started (CDP).
browser = [
  "playwright>=1.55.0",
]
docs = [
  "mkdocs>=1.6.0",
  "mkdocs-material>=9.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
  "external_ai: tests that call external AI providers and require local opt-in environment variables"
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["modules", "tests"]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "B",
  "UP",
  "SIM",
]
ignore = [
  "E501"
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"docs/*" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"


[tool.coverage.run]
source = ["modules"]

[tool.sotuhire]
architecture = "modular"
privacy_mode = "local-first"
auto_apply = false
review_required = true

[tool.setuptools.packages.find]
include = ["apps*", "modules*"]
